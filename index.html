<title>航一</title>
<style>
:root{
  --sky:#8ec5e8; --sky-deep:#5bb8d6; --sky-soft:#e3f2fa;
  --pink:#ffb3c6; --pink-deep:#ff8fab; --pink-soft:#ffe6ee;
  --bg1:#eaf6fd; --bg2:#fdeef4;
  --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  --ink:#46555f; --muted:#9bb0bc; --line:#e6eef3;
  --accent:#5cb8d6; --accent2:#ff9bb3;
  --good:#76c893; --bad:#ef8a8a; --warn:#f4c36b;
  --shadow:0 8px 24px rgba(120,160,190,.18);
  --radius:18px;
  --fast: .15s;
}
[data-theme="dark"]{
  --bg1:#1a2730; --bg2:#2a2230; --card:rgba(40,54,63,.82); --card-solid:#26333c;
  --ink:#dfeaf0; --muted:#7e93a0; --line:#33444f;
  --sky:#6aa9cc; --pink:#e07d97; --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;min-height:100%;}

/* ===== sidebar ===== */
#sidebar{
  width:210px;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.42));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--line);
  padding:16px 10px;display:flex;flex-direction:column;gap:3px;
  position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;
  z-index:30;
  transition:width .25s ease,padding .25s ease;
}
body.nav-collapsed #sidebar{width:0;padding-left:0;padding-right:0;border-right-color:transparent;overflow:hidden;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;}
.brand .logo{
  width:36px;height:36px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--sky),var(--pink));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:var(--shadow);
}
.brand .name{font-size:19px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(90deg,var(--sky-deep),var(--pink-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  border:none;background:transparent;color:var(--ink);cursor:pointer;
  padding:10px 11px;border-radius:14px;font-size:14.5px;transition:background var(--fast);position:relative;
}
.nav-btn .ic{width:23px;text-align:center;font-size:16px;opacity:.85;flex:none;}
.nav-btn:hover{background:rgba(255,255,255,.55);}
.nav-btn.active{background:linear-gradient(135deg,var(--sky-soft),var(--pink-soft));font-weight:700;color:var(--sky-deep);}
.nav-btn.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3.5px;border-radius:4px;background:linear-gradient(180deg,var(--sky),var(--pink));}
.dot{position:absolute;right:9px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--pink-deep);box-shadow:0 0 0 3px rgba(255,143,171,.25);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ===== main ===== */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.48));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
#hamburger{display:block;border:none;background:var(--card);border-radius:12px;width:38px;height:38px;font-size:19px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);}
#topbar .ttl{font-size:17px;font-weight:800;flex:1;}
#topbar .dt{font-size:12.5px;color:var(--muted);}
#content{padding:16px;max-width:900px;width:100%;margin:0 auto;}

/* ===== cards & components ===== */
.card{
  background:var(--card-solid);
  border:1px solid var(--line);border-radius:var(--radius);padding:15px;
  box-shadow:var(--shadow);margin-bottom:14px;
  content-visibility:auto;contain-intrinsic-size:auto 140px;
}
.card:active{transform:scale(.997);}
.card h3{margin:0 0 10px;font-size:15.5px;display:flex;align-items:center;gap:7px;font-weight:700;}
.card h3 .sub{font-size:12px;color:var(--muted);font-weight:400;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
input,select,textarea{
  font-family:inherit;font-size:16px;color:var(--ink);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 12px;
  background:var(--card-solid);outline:none;width:100%;transition:border-color var(--fast);
}
textarea{resize:vertical;min-height:132px;font-size:16px;line-height:1.8;}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-soft);}

.btn{border:none;border-radius:12px;padding:8px 14px;font-size:13.5px;cursor:pointer;background:var(--sky-soft);color:var(--sky-deep);font-weight:600;transition:all var(--fast);white-space:nowrap;}
.btn:hover{filter:brightness(.96);transform:translateY(-.5px);}
.btn:active{transform:translateY(0);}
.btn.primary{background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;border:none;}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;border:none;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px;}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:9px;}

.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:var(--sky-soft);color:var(--sky-deep);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all var(--fast);}
.chip.on{background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;}
.chip.pink{background:var(--pink-soft);color:var(--pink-deep);}
.chip.pink.on{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;}

.seg{display:inline-flex;background:var(--sky-soft);border-radius:12px;padding:3px;gap:3px;}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--sky-deep);font-weight:600;font-size:12.5px;transition:all var(--fast);}
.seg button.on{background:#fff;box-shadow:var(--shadow);}

.grid{display:grid;gap:12px;}
@media(min-width:720px){.grid.cols2{grid-template-columns:1fr 1fr;}.grid.cols3{grid-template-columns:1fr 1fr 1fr;}.grid.cols4{grid-template-columns:1fr 1fr 1fr 1fr;}}

.kpi{background:linear-gradient(135deg,var(--sky-soft),var(--pink-soft));border-radius:16px;padding:13px;text-align:center;}
.kpi .v{font-size:23px;font-weight:800;color:var(--ink);}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px;}
.kpi .v small{font-size:12.5px;font-weight:600;color:var(--muted);}

.item{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);transition:bg var(--fast);}
.item:last-child{border-bottom:none;}
.item:active{background:var(--sky-soft);border-radius:10px;margin:0 -5px;padding:9px 5px;}
.item .txt{flex:1;font-size:14px;min-width:0;word-break:break-word;}
.item .meta{font-size:11.5px;color:var(--muted);flex:none;}
.tag{font-size:10.5px;padding:1px 6px;border-radius:7px;background:var(--sky-soft);color:var(--sky-deep);margin-left:5px;font-weight:600;}
.tag.opt{background:var(--pink-soft);color:var(--pink-deep);}
.tag.mus{background:#fff3d6;color:#c79321;}

.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--sky);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:transparent;transition:all var(--fast);}
.ck.on{background:var(--sky);}
.mini{font-size:11.5px;color:var(--muted);cursor:pointer;background:none;border:none;padding:2px 4px;border-radius:6px;transition:color var(--fast);}
.mini:hover{color:var(--pink-deep);}
.del{color:var(--bad);cursor:pointer;background:none;border:none;font-size:12.5px;padding:2px 5px;border-radius:6px;transition:all var(--fast);}
.del:hover{background:var(--pink-soft);}
.edit{color:var(--sky-deep);cursor:pointer;background:none;border:none;font-size:12.5px;padding:2px 5px;border-radius:6px;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 8px;}
.banner{background:linear-gradient(135deg,var(--pink-soft),var(--sky-soft));border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:13px;display:flex;align-items:center;gap:9px;font-size:13.5px;}
.banner .go{margin-left:auto;flex:none;}
.barpct{height:8px;border-radius:6px;background:var(--line);overflow:hidden;flex:1;min-width:50px;}
.barpct>span{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--pink));border-radius:6px;transition:width .4s ease;}
.muted{color:var(--muted);} .right{margin-left:auto;} .center{text-align:center;}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
canvas{max-width:100%;height:auto !important;}

/* mobile drawer */
#overlay{display:none;position:fixed;inset:0;background:rgba(40,55,65,.35);z-index:40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
@media(max-width:760px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-105%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow);width:82vw;max-width:300px;height:100%;}
  body.nav-open #sidebar{transform:translateX(0);}
  #overlay{display:none;}
  body.nav-open #overlay{display:block;background:rgba(40,55,65,.10);}
  #content{padding:12px;}
  .card{padding:12px;}
}

.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px;}
.subtabs button{border:none;background:var(--sky-soft);color:var(--sky-deep);border-radius:11px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all var(--fast);}
.subtabs button.on{background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;}

.timer{font-size:58px;font-weight:800;text-align:center;letter-spacing:2px;
  background:linear-gradient(135deg,var(--sky-deep),var(--pink-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0;
  user-select:none;
}
.note{font-size:12px;color:var(--muted);background:var(--sky-soft);border-radius:10px;padding:7px 9px;margin-top:7px;line-height:1.55;}
.ovgrid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);}
@media(min-width:680px){.ovgrid{grid-template-columns:repeat(4,1fr);}}
.ovgrid.sc{grid-template-columns:repeat(3,1fr);margin-top:4px;}
.scbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card-solid);border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;cursor:pointer;transition:.15s;}
.scbtn:active{transform:scale(.96);}
.scbtn .sic{font-size:20px;line-height:1;}
.scbtn .stx{font-size:12px;color:var(--ink);font-weight:600;}

/* loading spinner */
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--sky);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* follow-along mode */
.follow-mode{background:linear-gradient(135deg,#fff8e1,#e8f5e9);border:2px solid #a5d6a7;border-radius:16px;padding:20px;text-align:center;margin:14px 0;}
.follow-mode .big-word{font-size:32px;font-weight:800;color:#2e7d32;margin:10px 0;}
.follow-mode .big-sentence{font-size:16px;color:#558b2f;line-height:1.8;margin:10px 0;}
.article-para{margin:16px 0;padding:12px;background:var(--bg1);border-radius:12px;border:1px solid var(--line);}
.article-en{font-size:16px;line-height:1.9;margin:0 0 8px;color:var(--ink);}
.article-en .word{display:inline-block;padding:0 1px;border-radius:3px;cursor:pointer;transition:background .15s;}
.article-en .word:hover{background:var(--sky-soft);color:var(--sky-dept);}
.article-zh{font-size:14px;line-height:1.8;margin:0;color:var(--muted);}

/* ===== Modal System (replaces tiny prompt()) ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(40,55,65,.45);z-index:999;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);justify-content:center;align-items:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card-solid);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:540px;max-height:85vh;overflow-y:auto;padding:24px;}
.modal-box h3{margin:0 0 14px;font-size:17px;}
.modal-box textarea{width:100%;min-height:280px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:16px;line-height:1.8;resize:vertical;font-family:inherit;color:var(--ink);background:var(--bg1);outline:none;}
.modal-box textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-soft);}
.modal-box input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:12px;outline:none;background:var(--bg1);}
.modal-box input:focus{border-color:var(--sky);}
.modal-box select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;margin-bottom:10px;}
.modal-box .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.modal-box .m-note{font-size:12.5px;color:var(--muted);margin:10px 0;line-height:1.7;}

/* ===== Performance Optimizations ===== */
/* per-card translateZ(0) removed (avoids layer explosion); content-visibility:auto on .card handles offscreen skipping */
/* skeleton loading — used sparingly */
.skeleton{background:linear-gradient(90deg,var(--sky-soft) 25%,var(--card-solid) 50%,var(--sky-soft) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:10px;height:16px;margin:8px 0;}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">航</div><div class="name">航一</div></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <div id="topbar">
      <button id="hamburger" onclick="toggleNav()" title="收起/展开菜单">☰</button>
      <div class="ttl" id="modTtl">总览</div>
      <div class="dt" id="modDt"></div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div id="overlay" onclick="closeNav()"></div>
<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()"></div>
<script>
/* ================================================================
   航一 — All-in-One 生活工作台 v3
   性能优化 · 模块化自定义 · 天蓝+夕阳粉治愈风
   ================================================================ */

/* ============ storage helper ============ */
const LS={
  get(k,d){try{const v=localStorage.getItem('hy_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){localStorage.setItem('hy_'+k,JSON.stringify(v));_syncFlash();},
  del(k){localStorage.removeItem('hy_'+k);}
};
const $=id=>document.getElementById(id);
let _syncTimer=null;
function _syncFlash(){
  try{localStorage.setItem('hy__lastsave',Date.now());}catch(e){}
  if(typeof document==='undefined'||!document.body)return;
  let t=$('syncToast');
  if(!t){
    t=document.createElement('div');t.id='syncToast';
    t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);z-index:60;background:rgba(40,52,64,.94);color:#fff;font-size:13px;padding:9px 15px;border-radius:22px;box-shadow:0 8px 22px rgba(0,0,0,.28);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent='✓ 已自动保存';
  t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(8px)';},1100);
}
function lastSaveStr(){const t=localStorage.getItem('hy__lastsave');return t?new Date(+t).toLocaleString('zh-CN',{hour12:false}):'尚未保存';}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function todayStr(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function nowHMS(){return new Date().toTimeString().slice(0,5);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* debounce for rapid clicks */
let _rendering=false;
let _renderQ=[]; // render queue for batching
function safeRender(fn){
  // Use requestAnimationFrame to batch renders — prevents jank
  requestAnimationFrame(()=>{
    fn();
    // Reset flag after paint
    setTimeout(()=>{_rendering=false;},50);
  });
}

// Quick loading indicator
function showLoading(msg){
  const c=$('content');
  if(c) c.innerHTML='<div class="card center" style="padding:40px"><div class="skeleton" style="width:60%;margin:12px auto"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:45%"></div><div class="muted" style="margin-top:16px">'+(msg||'加载中…')+'</div></div>';
}

/* ============ module definitions ============ */
const MODULES=[
  {id:'overview',name:'总览',ic:'◎'},
  {id:'plan',    name:'每日打卡',ic:'✓'},
  {id:'body',    name:'身体管理',ic:'❤'},
  {id:'write',   name:'写作入口',ic:'✎'},
  {id:'read',    name:'阅读任务',ic:'📚'},
  {id:'english', name:'英语学习',ic:'🔤'},
  {id:'focus',   name:'专注记录',ic:'⏱'},
  {id:'settings',name:'设置',ic:'⚙'},
];
let curMod='overview';

/* ============ navigation ============ */
function buildNav(){
  const nav=$('nav');
  let html='';
  MODULES.forEach(m=>{
    const active=m.id===curMod?' active':'';
    const dot=hasNew(m.id)?'<span class="dot"></span>':'';
    html+='<button class="nav-btn'+active+'" data-mod="'+m.id+'"><span class="ic">'+m.ic+'</span>'+m.name+dot+'</button>';
  });
  nav.innerHTML=html;
  // event delegation
  nav.onclick=e=>{
    const btn=e.target.closest('[data-mod]');
    if(btn) go(btn.dataset.mod);
  };
}
function hasNew(id){return false;}
function go(id){
  if(curMod===id) return; // already here, skip
  curMod=id;
  if(id==='english') LS.set('bbc_new',false);

  const m=MODULES.find(x=>x.id===id);
  $('modTtl').textContent=m?m.name:'';
  $('modDt').textContent=todayStr();
  closeDrawer();

  // Update nav (lightweight — just toggle active class)
  const btn=$('nav').querySelector('[data-mod="'+id+'"]');
  if(btn){$('nav').querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

  // Render directly — no loading skeleton flash
  const renders={
    overview:renderOverview, plan:renderPlan, body:renderBody,
    write:renderWrite, read:renderRead,
    english:renderEnglish, focus:renderFocus,
    report:()=>renderReport('week'), settings:renderSettings
  };
  $('content').innerHTML='';
  if(renders[id]) renders[id]();
  window.scrollTo({top:0,behavior:'instant'});
}
function toggleNav(){
  if(window.innerWidth<=760){
    document.body.classList.toggle('nav-open');
  } else {
    document.body.classList.toggle('nav-collapsed');
  }
}
function closeNav(){document.body.classList.remove('nav-open');}
function closeDrawer(){closeNav();}

/* ===== Modal System (replaces prompt() for large text input) ===== */
let _modalResolve=null;
function showModal(opts){
  const ov=$('modalOverlay');
  let h='<div class="modal-box"><h3>'+esc(opts.title)+'</h3>';
  if(opts.note)h+='<div class="m-note">'+opts.note+'</div>';
  (opts.fields||[]).forEach(f=>{
    if(f.type==='textarea'){
      h+='<textarea id="m_'+f.id+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(f.value||'')+'</textarea>';
    } else if(f.type==='select'){
      h+='<select id="m_'+f.id+'">'+(f.options||[]).map(o=>'<option value="'+o.v+'" '+(o.v===f.value?'selected':'')+'>'+esc(o.t)+'</option>').join('')+'</select>';
    } else {
      const fv=f.value!=null?f.value:'';
      const ph=esc(f.placeholder||'');
      const v=esc(fv);
      const tp=f.type||'text';
      h+=`<input id="m_${f.id}" type="${tp}" placeholder="${ph}" value="${v}">`;
    }
    if(f.label)h+='<div class="meta" style="margin-top:-8px;margin-bottom:10px">'+f.label+'</div>';
  });
  h+='<div class="modal-actions">';
  h+='<button class="btn ghost" onclick="closeModal()">取消</button>';
  h+='<button class="btn primary" onclick="confirmModal()">确定保存</button></div></div>';
  ov.innerHTML=h;ov.classList.add('show');
  _modalResolve=opts.onSave;
  // auto-focus first field
  const first=ov.querySelector('input,textarea');
  if(first)setTimeout(()=>first.focus(),100);
}
function closeModal(){$('modalOverlay').classList.remove('show');_modalResolve=null;}
function confirmModal(){
  const ov=$('modalOverlay');
  const fields={};
  ov.querySelectorAll('[id^="m_"]').forEach(el=>{fields[el.id.slice(2)]=el.value.trim();});
  if(_modalResolve)_modalResolve(fields);
  closeModal();
}

/* ================================================================
   模块 1：每日打卡（完全自定义，无默认预设）
   ================================================================ */
let planFilter='all';
/* 用户默认每日计划模板（可在「⚙ 管理」中完全自定义：增/删/改、设必做或选做） */
const PLAN_TPL_VERSION='2026-07-30-v3'; // bump this when DEFAULT_PLAN changes to force update
const DEFAULT_PLAN=[
  {time:'6:30-8:30',items:[
    {t:'起床·唤醒拉伸·拉窗帘',must:true},
    {t:'梳头30下·洗漱·护肤(保湿+防晒)',must:true},
    {t:'晨间运动(上下齐发+大鹏展翅+扭转乾坤+前后击掌+扩胸各20下)',must:true},
    {t:'晨间充电(写作500字·阅读投资10页)',must:true}
  ]},
  {time:'8:30-12:00',items:[
    {t:'早餐(9:00前·粥+蛋)·倒水·多维',must:true},
    {t:'组合运动(交叉踮脚+后抬踮脚+金鸡独立各20下+懒腰踮脚10下·劳宫穴+大鱼际+曲池穴十三阴交+神门穴各30下·腹式呼吸10下·每小时活动·远眺)',must:true},
    {t:'日计划·优先高价值工作(最复杂任务先做)',must:true}
  ]},
  {time:'12:00-14:00',items:[
    {t:'午餐(12:00前·七分饱·粗碳+优质蛋白+深绿色蔬菜)·漱口',must:true},
    {t:'午间运动(腹式呼吸10下+站立/散步10min+靠墙静蹲2min+靠墙俯卧撑+前勾踢腿35下)',must:true},
    {t:'午间充电(英语阅读跟读+多邻国2单元·阅读投资10页)',must:true},
    {t:'午休',must:true}
  ]},
  {time:'14:00-18:00',items:[
    {t:'情报刷新·日复盘(投资·记账·复盘)',must:true},
    {t:'倒水·西罗莫司(15:30)',must:true},
    {t:'组合运动(眼操+耳操+淋巴操各8组·握拳踮脚+仰天踮脚+踢腿后抬各20下+懒腰踮脚10下·腹式呼吸10下·每小时活动·远眺)',must:true}
  ]},
  {time:'18:00-22:30',items:[
    {t:'晚间运动(骑车/超慢跑20-30min每周3此)',must:false},
    {t:'晚餐(20:00前+少精制碳水)',must:true},
    {t:'拉窗帘(20:30前调灯光)·梳头30下·卸妆·洗漱·洗澡·护肤(保湿+面膜+提拉)',must:true},
    {t:'睡前放松(金刚坐+欧阳春晓肩背15min·涌泉穴+臀桥+摇腿+二郎腿各50下·睡前拉伸·还阳卧+揉腹1-3次)',must:true},
    {t:'阅读投资10页·冥想(22:30前+正念478呼吸法)',must:true},
    {t:'保证7-8h优质睡眠',must:true}
  ]}
];
function getPlanTpl(){return LS.get('plan_tpl',[]);}
function getPlanDay(date){
  const key='plan_'+date;
  let day=LS.get(key,null);
  if(!day){
    const tpl=getPlanTpl();
    day=tpl.map(b=>({
      time:b.time,
      items:(b.items||[]).map(it=>({id:uid(),t:it.t,must:!!it.must,done:false}))
    }));
    LS.set(key,day);
  }
  return day;
}
function savePlanDay(date,day){LS.set('plan_'+date,day);}

function renderPlan(){
  if(planView==='review'){renderPlanReview();return;}
  const tpl=getPlanTpl();
  const day=getPlanDay(todayStr());
  let total=0, done=0, tm=0, dm=0;
  day.forEach(b=>(b.items||[]).forEach(it=>{total++;if(it.done)done++;if(it.must){tm++;if(it.done)dm++;}}));
  const pct=total?Math.round(done/total*100):0;

  let h='<div class="card"><div class="row" style="justify-content:space-between">';
  h+='<h3 style="margin:0">每日打卡</h3>';
  h+='<div class="seg"><button class="'+(planFilter==='all'?'on':'')+'" data-pf="all">全部</button>';
  h+='<button class="'+(planFilter==='must'?'on':'')+'" data-pf="must">必做</button>';
  h+='<button class="'+(planFilter==='opt'?'on':'')+'" data-pf="opt">选做</button></div></div>';

  // progress bar
  h+='<div class="row" style="margin:4px 0 12px"><div class="barpct"><span style="width:'+pct+'%"></span></div>';
  h+='<span class="meta" style="margin-left:8px">'+done+'/'+total+' 完成'+(tm?' · 必做 '+dm+'/'+tm:'')+'</span></div>';

  // actions
  h+='<div class="row"><button class="btn primary sm" onclick="copyYesterday()">复制昨日</button>';
  h+='<button class="btn ghost sm" onclick="resetToday()">重置今日</button>';
  h+='<button class="btn pink sm" onclick="addTimeBlock()">＋ 时段</button>';
  h+='<button class="btn ghost sm" onclick="editPlanSettings()">⚙ 管理</button>';
  h+='<button class="btn sm" onclick="planView=\'review\';renderPlan()">📊 复盘</button></div></div>';

  // time blocks
  day.forEach((b,bi)=>{
    const items=(b.items||[]).filter(it=>planFilter==='all'||(planFilter==='must'&&it.must)||(planFilter==='opt'&&!it.must));
    if(planFilter!=='all'&&items.length===0) return;
    const bt=(b.items||[]).length, bd=(b.items||[]).filter(it=>it.done).length;
    h+='<div class="card"><h3>'+esc(b.time||'未命名时段')+' <span style="font-size:12px;color:#8a93a6;font-weight:600">'+bd+'/'+bt+'</span>';
    h+='<span class="right" style="display:flex;gap:4px">';
    h+='<button class="btn xs" onclick="addPlanItem('+bi+')">＋项</button>';
    h+='<button class="mini" onclick="renameBlock('+bi+')">✎</button>';
    h+='<button class="del" onclick="delBlock('+bi+')">✕</button></span></h3>';
    if(!items.length){h+='<div class="empty">本段无项</div>';}
    else{
      items.forEach((it,ii)=>{
        const gi=(b.items||[]).indexOf(it);
        h+='<div class="item"><button class="ck '+(it.done?'on':'')+'" data-toggle="'+bi+','+gi+'">'+(it.done?'✓':'')+'</button>';
        h+='<div class="txt '+(it.done?'muted':'')+'">'+esc(it.t)+(it.must?'<span class="tag">必</span>':'<span class="tag opt">选</span>')+'</div>';
        h+='<button class="mini" onclick="editPlanItem('+bi+','+gi+')">✎</button>';
        h+='<button class="del" onclick="delPlanItem('+bi+','+gi+')">✕</button></div>';
      });
    }
    h+='</div>';
  });

  if(!tpl.length){
    h+='<div class="card center"><div class="empty" style="padding:24px">还没有设置打卡项目<br><br>点击「＋ 时段」或「⚙ 管理」开始定制你的每日计划</div>';
    h+='<button class="btn primary" onclick="editPlanSettings()">开始设置</button></div>';
  }

  $('content').innerHTML=h;

  // bind filter buttons
  $('content').querySelectorAll('[data-pf]').forEach(btn=>{
    btn.onclick=()=>{planFilter=btn.dataset.pf;renderPlan();};
  });
  // bind checkboxes via delegation
  $('content').querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.onclick=()=>{
      const [bi,gi]=btn.dataset.toggle.split(',').map(Number);
      togglePlanItem(bi,gi);
    };
  });
}

// --- plan actions ---
function togglePlanItem(bi,gi){

  if(day[bi]&&day[bi].items&&day[bi].items[gi]){
    day[bi].items[gi].done=!day[bi].items[gi].done;
    savePlanDay(todayStr(),day);
  }
  renderPlan();
}
function editPlanItem(bi,gi){
  const day=getPlanDay(todayStr());

  showModal({
    title:'修改任务',
    fields:[
      {id:'t',type:'text',placeholder:'任务内容',value:it.t},
      {id:'must',type:'select',label:'类型',value:it.must?'必':'选',
        options:[{v:'必',t:'必做'},{v:'选',t:'选做'}]}

function delPlanItem(bi,gi){

}
function addPlanItem(bi){

  const must=confirm('设为「必做」？(取消=选做)');
  const item={id:uid(),t:t.trim(),must,done:false};
  const day=getPlanDay(todayStr());

function addTimeBlock(){

function renameBlock(bi){

function delBlock(bi){if(!confirm('删除整个时段？'))return;

function resetToday(){if(!confirm('重置今日所有勾选？'))return;
  LS.del('plan_'+todayStr());renderPlan();}
function copyYesterday(){
  const y=new Date(Date.now()-86400000);y.setMinutes(y.getMinutes()-y.getTimezoneOffset());
  const ys=y.toISOString().slice(0,10);
  const yd=LS.get('plan_'+ys,null);
  if(!yd||!yd.length){alert('昨日无记录');return;}
  const today=yd.map(b=>({time:b.time,items:(b.items||[]).map(it=>({id:uid(),t:it.t,must:it.must,done:false}))}));
  savePlanDay(todayStr(),today);renderPlan();

// --- plan settings (full customization - uses large modal) ---
function editPlanSettings(){
  const tpl=getPlanTpl();
  let txt='';
  tpl.forEach(b=>{
    txt+='【'+b.time+'】\n';
    (b.items||[]).forEach(it=>txt+='| '+it.t+' | '+(it.must?'必':'选')+'\n');
    txt+='\n';
  });
  showModal({
    title:'编辑每日打卡模板',
    note:'格式说明：\n• 【时段名】开始一个时段\n• | 任务内容 | 必做/选做(m/o)\n• 每行一个任务，空行忽略\n• 示例：\n【6:30-8:30】\n| 起床·洗漱 | 必\n| 晨间运动 | 必',
    fields:[{id:'tpl',type:'textarea',placeholder:'在此输入/编辑你的每日计划模板…',value:txt}],
    onSave:function(f){
      if(!f.tpl)return;
      const lines=f.tpl.split('\n').map(s=>s.trim()).filter(Boolean);
      const ntpl=[];
      let curBlock=null;
      lines.forEach(l=>{
        if(l.startsWith('【')&&l.endsWith('】')){curBlock={time:l.slice(1,-1),items:[]};ntpl.push(curBlock);return;}
        if(l.startsWith('|')&&!curBlock)return;
        const p=l.split('|').map(s=>s.trim());
        if(p.length>=3&&curBlock){
          curBlock.items.push({t:p[1],must:(p[2]==='必'||p[2]==='m')});
        } else if(l&&!curBlock){
          ntpl.push({time:l,items:[]});curBlock=ntpl[ntpl.length-1];
        }
      });
      LS.set('plan_tpl',ntpl);
      LS.del('plan_'+todayStr());
      renderPlan();
    }
  });
}

// ---- 睡眠（标准：21:00-23:00 早睡，7-10h 时长达标）----
function getSleepLogs(){return LS.get('sleep',[]);}

function renderSleep(){
  const logs=getSleepLogs();
  const today=logs.find(l=>l.date===todayStr())||{};
  const calcDur=(bed,wake)=>{
    if(!bed||!wake)return null;
    const [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number);
    let m=(wh*60+wm)-(bh*60+bm);if(m<0)m+=1440;return m;
  };

  const autoDur=calcDur(today.bed,today.wake);
  const durVal=today.dur!=null?today.dur:(autoDur!=null?autoDur/60:null);
  let h='<div class="card"><h3>睡眠记录</h3><div class="row">';
  h+='<input id="sl_bed" type="time" value="'+(today.bed||'22:30')+'" style="max-width:130px" placeholder="入睡">';
  h+='<input id="sl_wake" type="time" value="'+(today.wake||'07:00')+'" style="max-width:130px" placeholder="起床">';
  h+='<input id="sl_dur" type="number" step="0.1" placeholder="时长(h)" value="'+(durVal!=null?durVal:'')+'" style="max-width:110px" title="手动输入睡眠时长，留空则按入睡/起床自动计算">';
  h+='<button class="btn primary" onclick="saveSleep()">保存今日</button></div>';

  if(durVal!=null){
    const durMin=Math.round(durVal*60);
    const early=today.bed>='21:00'&&today.bed<='23:59';
    const durOk=durMin>=420&&durMin<=600;
    h+='<div class="row" style="flex-wrap:wrap;margin-top:8px">';
    h+='<span class="chip on">时长 '+Math.floor(durMin/60)+'h'+(durMin%60)+'m</span>';
    h+='<span class="chip '+(early?'on':'')+'">早睡'+(early?' ✓':' (21点前)')+'</span>';
    h+='<span class="chip '+(durOk?'on':'')+'">时长达标'+(durOk?' ✓':' (7-10h)')+'</span>';
    h+='</div>';
  }
  h+='<div class="note">早睡标准：21:00–23:00 入睡；时长达标：7–10 小时。时长可手动输入（单位：小时），留空则按入睡/起床自动计算。</div></div>';

  // 近7日列表
  h+='<div class="card"><h3>近 7 日</h3>';
  const recent=logs.slice().reverse().slice(0,7);
  if(!recent.length)h+='<div class="empty">暂无记录</div>';
  recent.forEach(l=>{
    const d=l.dur!=null?Math.round(l.dur*60):calcDur(l.bed,l.wake);
    const early=l.bed>='21:00'&&l.bed<='23:59';
    const durOk=d>=420&&d<=600;
    h+='<div class="item"><div class="txt">'+l.date+' · '+l.bed+' → '+l.wake+'</div>';
    h+='<div class="meta">'+(d?Math.floor(d/60)+'h'+(d%60)+'m':'—')
      +' '+(early?'🌙':'')+(durOk?'✓':'')+'</div></div>';
  });
  h+='</div>';
  $('bodySub').innerHTML=h;
}
function saveSleep(){
  const bed=$('sl_bed').value,wake=$('sl_wake').value;
  const durIn=$('sl_dur').value;
  const dur=durIn!==''?Math.round(parseFloat(durIn)*100)/100:null;
  if(!bed||!wake)return;
  const logs=getSleepLogs();
  const i=logs.findIndex(l=>l.date===todayStr());
  const o={date:todayStr(),bed,wake,dur};
  if(i>=0)logs[i]=o;else logs.push(o);
  LS.set('sleep',logs);renderSleep();
}

      h+='<span class="chip">'+totalMin+' 分钟</span><span class="chip">'+totalCal+' kcal</span></div>';
    }
    h+='</div>';
  } else {
    // 近7日视图：按日期汇总
    const now=new Date();

    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);weekDates.push(d.toISOString().slice(0,10));}
    const weekLogs=allLogs.filter(x=>weekDates.includes(x.date));
    // group by date
    const byDate={};
    weekDates.forEach(d=>byDate[d]=[]);
    weekLogs.forEach(x=>{if(byDate[x.date])byDate[x.date].push(x);});

    // week summary stats
    const wTotalMin=weekLogs.reduce((s,x)=>s+(+x.dur||0),0);

    h+='<div class="card"><h3>每日明细</h3>';
    let hasData=false;
    weekDates.forEach(dt=>{

      const isToday=dt===todayStr();
      h+='<div class="item" style="flex-direction:column;align-items:stretch'+(isToday?';background:var(--sky-soft);border-radius:10px;margin:0 -5px;padding:9px 5px':'')+'">';
      h+='<div class="row"><b>'+dt+(isToday?' 今天':'')+'</b>';

        h+='<span class="right"><span class="chip on">'+items.length+'次</span>';
        h+='<span class="chip">'+min+'min</span><span class="chip">'+cal+'kcal</span></span>';

  });

function saveWeight(){
  const date=$('w_date').value,val=+$('w_val').value||0,waist=+$('w_waist').value||0;
  if(!val)return;

function delWeight(date){const logs=getWeightLogs().filter(r=>r.date!==date);LS.set('weight',logs);renderWeight();}
function drawWeightChart(data){
  const c=$('wchart');if(!c)return;
  const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  const vals=data.map(d=>d.val).filter(v=>v!=null);if(vals.length<2)return;
  const min=Math.min(...vals)-1,max=Math.max(...vals)+1,n=data.length;
  const px=i=>40+i*(560/(n-1)),py=v=>20+(1-(v-min)/(max-min))*180;
  // grid
  x.strokeStyle='#e6eef3';x.lineWidth=.8;
  for(let g=0;g<=4;g++){const yy=20+g*45;x.beginPath();x.moveTo(40,yy);x.lineTo(600,yy);x.stroke();}
  // line
  const grad=x.createLinearGradient(0,0,600,0);grad.addColorStop(0,'#8ec5e8');grad.addColorStop(1,'#ffb3c6');
  x.strokeStyle=grad;x.lineWidth=2.5;x.beginPath();
  data.forEach((d,i)=>{if(d.val!=null){i?x.lineTo(px(i),py(d.val)):x.moveTo(px(i),py(d.val));}});
  x.stroke();
  // dots + labels
  x.fillStyle='#5bb8d6';x.font='bold 11px sans-serif';
  data.forEach((d,i)=>{if(d.val!=null){x.beginPath();x.arc(px(i),py(d.val),3.5,0,Math.PI*2);x.fill();x.fillText(d.val,px(i)-10,py(d.val)-7);}});
}

  const dc=getDietChk()[todayStr()]||{bf:false,lunch:false,dinner:false,mv:false,water:0};
  let ck='<div class="card"><h3>今日饮食打卡</h3>';
  ck+='<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:12px">';
  ck+='<button class="ck '+(dc.bf?'on':'')+'" onclick="toggleDiet(\'bf\')">'+(dc.bf?'✓ ':'')+'早餐</button>';
  ck+='<button class="ck '+(dc.lunch?'on':'')+'" onclick="toggleDiet(\'lunch\')">'+(dc.lunch?'✓ ':'')+'午餐</button>';
  ck+='<button class="ck '+(dc.dinner?'on':'')+'" onclick="toggleDiet(\'dinner\')">'+(dc.dinner?'✓ ':'')+'晚餐</button>';
  ck+='<button class="ck '+(dc.mv?'on':'')+'" onclick="toggleDiet(\'mv\')">'+(dc.mv?'✓ ':'')+'多维</button>';
  ck+='</div>';
  ck+='<div class="row" style="justify-content:center;gap:12px;align-items:center;background:var(--bg1);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:4px">';
  ck+='<span style="font-weight:600;font-size:15px">💧 饮水</span>';
  ck+='<input id="d_water" type="number" step="0.1" min="0" value="'+(dc.water||'')+'" placeholder="__" style="width:96px;text-align:center;font-size:18px;padding:8px;border-radius:10px;border:1.5px solid var(--line)">';
  ck+='<span style="color:var(--muted)">升 (L)</span></div>';
  ck+='</div>';

  let h=ck+'<div class="card"><h3>饮食记录</h3>';
  h+='<div class="note">原则：七分饱 · 粗碳 · 优质蛋白 · 深绿蔬菜 · 少精制碳水</div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">';
  h+='<div class="row" style="gap:8px"><input id="d_date" type="date" value="'+todayStr()+'" style="max-width:150px">';
  h+='<select id="d_meal" style="max-width:90px"><option>早</option><option>午</option><option>晚</option><option>加餐</option></select>';
  h+='<input id="d_kcal" type="number" placeholder="热量 kcal" style="max-width:120px"></div>';
  h+='<input id="d_food" placeholder="吃了什么？（可详细记录：菜品 + 分量）" style="padding:11px;font-size:15px">';
  h+='<div class="row" style="gap:8px"><select id="d_healthy" style="flex:1"><option value="">是否健康均衡？</option><option value="是">✅ 是，均衡</option><option value="部分">🟡 部分均衡</option><option value="否">⚠️ 否，偏油腻/过量</option></select>';
  h+='<button class="btn primary" onclick="saveDiet()">＋ 记录</button></div>';
  h+='</div></div>';

  const todayLogs=logs.filter(x=>x.date===todayStr());
  if(todayLogs.length){
    const k=todayLogs.reduce((s,x)=>s+(+x.kcal||0),0);
    h+='<div class="card"><div class="row"><span class="chip on">今日 '+todayLogs.length+' 餐</span><span class="chip">'+k+' kcal</span></div></div>';
  }
  h+='<div class="card"><h3>今日记录</h3>';
  if(!logs.length)h+='<div class="empty">还没有饮食记录</div>';
  logs.slice().reverse().slice(0,20).forEach(x=>{
    const gi=logs.indexOf(x);
    h+='<div class="item"><div class="txt"><b>'+esc(x.date)+'</b> <span class="tag">'+esc(x.meal||'')+'</span> '+esc(x.food||'')+'</div>';
    h+='<div class="meta">'+(x.healthy?'<span class="chip">'+esc(x.healthy)+'</span> ':'')+(x.kcal?x.kcal+'kcal':'')+'</div>';
    h+='<button class="del" onclick="delDiet('+gi+')">✕</button></div>';
  });
  h+='</div>';
  $('bodySub').innerHTML=h;
}
function setWater(v){
  const d=getDietChk()[todayStr()]||{bf:false,lunch:false,dinner:false,mv:false,water:0};
  d.water=Math.max(0,parseFloat(v)||0);saveDietChk(d);renderDiet();
}
function saveDiet(){
  const date=$('d_date').value,food=$('d_food').value.trim(),meal=$('d_meal').value,kcal=+$('d_kcal').value||0,healthy=$('d_healthy').value;
  if(!food)return;
  const logs=getDietLogs();logs.push({date,meal,food,healthy,kcal});LS.set('diet',logs);renderDiet();
}
function delDiet(i){const logs=getDietLogs();logs.splice(i,1);LS.set('diet',logs);renderDiet();}

let readTab='books';
let editBookId=-1;
function getBooks(){return LS.get('books',[]);}
function getCards(){return LS.get('cards',[]);}

function renderRead(){
  const checked=isReadChecked(todayStr());
  const rs=readStats();
  let ck='<div class="card"><h3>今日阅读打卡</h3><div class="row">';
  ck+='<button class="ck '+(checked?'on':'')+'" onclick="toggleReadToday()">'+(checked?'✓ 今日已读':'○ 今日未读')+'</button>';
  ck+='<span class="meta">本周 '+rs.week+' 天 · 本月 '+rs.month+' 天 · 年度 '+rs.year+' 天</span></div></div>';
  let h=ck+'<div class="card"><h3>阅读任务</h3><div class="subtabs">';
  [['books','书单'],['cards','卡片笔记'],['notes','读书笔记']].forEach(t=>{
    h+='<button class="'+(readTab===t[0]?'on':'')+'" data-rtab="'+t[0]+'">'+t[1]+'</button>';
  });

// 书单（想读/在读/读完 均可添加、编辑、删减；非编辑态直接呈现状态，不在读显示进度）
function renderBooks(){
  const box=$('readBody');if(!box)return;
  const b=getBooks();
  const st=['想读','在读','读完'];
  let h='';
  h+='<div class="card"><div class="row">';
  h+='<input id="b_title" placeholder="书名" style="flex:1">';
  h+='<input id="b_author" placeholder="作者" style="max-width:110px">';
  h+='<select id="b_status" style="max-width:90px">';
  st.forEach(s=>h+='<option value="'+s+'">'+s+'</option>');
  h+='</select>';
  h+='<button class="btn primary sm" onclick="addBook()">+ 加书</button></div></div>';

  st.forEach(s=>{
    const list=b.filter(x=>x.status===s);
    h+='<div class="card"><h3>'+s+' <span class="sub">'+list.length+' 本</span></h3>';
    if(!list.length)h+='<div class="empty">—</div>';
    list.forEach((x,i)=>{
      const gi=b.indexOf(x);
      if(editBookId===gi){
        // 编辑态：可改书名、作者、状态，可保存/取消
        h+='<div class="item" style="flex-direction:column;align-items:stretch">';
        h+='<input id="eb_title" value="'+esc(x.title)+'" placeholder="书名" style="margin-bottom:6px">';
        h+='<div class="row">';
        h+='<input id="eb_author" placeholder="作者" value="'+esc(x.author||'')+'" style="flex:1">';
        h+='<select id="eb_status" style="max-width:90px">';
        st.forEach(o=>h+='<option '+(o===x.status?'selected':'')+'>'+o+'</option>');
        h+='</select>';
        h+='<button class="btn sm" onclick="saveBookEdit('+gi+')">保存</button>';
        h+='<button class="del" onclick="cancelBookEdit()">取消</button>';
        h+='</div></div>';
      } else {
        // 非编辑态：直接呈现书名 + 状态，不显示进度
        h+='<div class="item">';
        h+='<div class="txt"><b>'+esc(x.title)+'</b>'+(x.author?' <span class="meta">'+esc(x.author)+'</span>':'')
          +' <span class="chip">'+x.status+'</span></div>';
        h+='<button class="btn xs" onclick="editBook('+gi+')">✎</button>';
        h+='<button class="del" onclick="delBook('+gi+')">✕</button>';
        h+='</div>';
      }
    });
    h+='</div>';
  });
  box.innerHTML=h;
}
function addBook(){
  const t=$('b_title').value.trim();if(!t)return;
  const b=getBooks();
  b.push({id:uid(),title:t,author:$('b_author').value.trim(),status:$('b_status').value});
  LS.set('books',b);editBookId=-1;renderBooks();
}
function delBook(i){const b=getBooks();b.splice(i,1);LS.set('books',b);renderBooks();}
function editBook(i){editBookId=i;renderBooks();}
function cancelBookEdit(){editBookId=-1;renderBooks();}
function saveBookEdit(i){
  const b=getBooks();
  const t=$('eb_title').value.trim();if(!t){editBookId=-1;renderBooks();return;}
  b[i].title=t;
  b[i].author=$('eb_author').value.trim();
  b[i].status=$('eb_status').value;
  LS.set('books',b);editBookId=-1;renderBooks();
}

// 卡片笔记法
function renderCards(){
  const box=$('readBody');if(!box)return;
  const b=getBooks();const c=getCards();
  let h='<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">卡片笔记法</h3>';
  h+='<button class="btn pink sm" onclick="addCard()">+ 新卡片</button></div>';
  h+='<div class="row"><select id="cf_book" style="max-width:155px"><option value="">（不关联）</option>'
    +b.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('')
    +'</select>';
  h+='<input id="cf_tag" placeholder="标签筛选" style="max-width:150px">';
  h+='<button class="btn sm" onclick="drawCardList()">筛选</button></div>';
  h+='<div class="note">每张卡＝一个原子观点＋标签＋来源。同标签自动互链。</div></div>';
  h+='<div class="card" id="cardBox"></div>';
  box.innerHTML=h;
  drawCardList();
}
function drawCardList(){
  const b=getBooks();const c=getCards();
  const book=$('cf_book')?$('cf_book').value:'';
  const tag=$('cf_tag')?$('cf_tag').value.trim():'';
  let list=c.slice().reverse();
  if(book)list=list.filter(x=>x.bookId===book);
  if(tag)list=list.filter(x=>(x.tags||'').split(',').map(s=>s.trim()).includes(tag));
  const box=$('cardBox');if(!box)return;
  if(!list.length){box.innerHTML='<div class="empty">还没有卡片</div>';return;}
  let h='';
  list.forEach(cd=>{
    const gi=c.indexOf(cd);
    const bn=b.find(x=>x.id===cd.bookId);
    h+='<div class="item" style="flex-direction:column;align-items:stretch">';
    h+='<div class="txt">'+esc(cd.text)+'</div>';
    h+='<div class="row" style="margin-top:5px">';
    (cd.tags||'').split(',').filter(Boolean).forEach(t=>{
      h+='<span class="chip" onclick="quickTag(\''+t.trim().replace(/'/g,'\\\'')+'\')">'+esc(t.trim())+'</span>';
    });
    if(bn)h+='<span class="meta">📚 '+esc(bn.title)+'</span>';
    h+='<span class="right"><button class="btn xs" onclick="viewCard('+gi+')">打开</button>';
    h+='<button class="del" onclick="delCard('+gi+')">✕</button></span></div></div>';
  });
  box.innerHTML=h;
}
function quickTag(t){if($('cf_tag')){$('cf_tag').value=t;drawCardList();}}
function addCard(){
  const bookId=$('cf_book')?$('cf_book').value:'';
  const tags=$('cf_tag')?$('cf_tag').value.trim():'';
  showModal({
    title:'新卡片',
    note:'一张卡片 = 一个原子观点 + 标签。简短有力。',
    fields:[{id:'text',type:'textarea',placeholder:'写下你的一个原子观点、摘录或灵感…',value:''}],
    onSave:function(f){
      if(!f.text)return;
      const c=getCards();
      c.push({id:uid(),bookId,text:f.text.trim(),tags,date:todayStr()});
      LS.set('cards',c);renderCards();
    }
  });
}
function delCard(i){const c=getCards();c.splice(i,1);LS.set('cards',c);renderCards();}

function saveNote(){
  const id=$('nt_book').value;if(!id){alert('先选择一本书');return;}
  const date=$('nt_date').value||todayStr();
  const body=$('nt_body').value.trim();if(!body)return;
  const notes=LS.get('book_notes',[]);
  notes.unshift({id:uid(),bookId:id,body,date});
  LS.set('book_notes',notes);
  $('nt_body').value='';
  renderNotes();
}
function editNote(i){
  const notes=LS.get('book_notes',[]);const n=notes[i];if(!n)return;
  const b=getBooks();
  const options=[{v:'',t:'（不关联）'}].concat(b.map(x=>({v:x.id,t:x.title})));
  showModal({
    title:'编辑读书笔记',
    note:'修改后保存即可。',
    fields:[
      {id:'book',type:'select',label:'关联书籍',value:n.bookId||'',options:options},
      {id:'date',type:'date',label:'日期',value:n.date||todayStr()},
      {id:'body',type:'textarea',placeholder:'笔记内容…',value:n.body||''}
    ],
    onSave:function(f){
      if(!f.body)return;
      n.bookId=f.book||n.bookId;n.date=f.date||todayStr();n.body=f.body.trim();
      LS.set('book_notes',notes);renderNotes();
    }
  });
}
function delNote(i){const notes=LS.get('book_notes',[]);notes.splice(i,1);LS.set('book_notes',notes);renderNotes();}

function viewText(title,body){

function editWrite(i){const w=getWrites()[i];if(!w)return;showModal({title:'编辑写作',note:'修改后点保存即可。',fields:[{id:'title',type:'text',placeholder:'标题（可选）',value:w.title||''},{id:'body',type:'textarea',placeholder:'内容…',value:w.body||''},{id:'date',type:'date',label:'日期',value:w.date||todayStr()}],onSave:function(f){if(!f.body&&!f.title)return;w.title=f.title.trim();w.body=f.body.trim();w.date=f.date||todayStr();LS.set('writes',getWrites());syncWriteLog();renderWrite();toast('已保存');}});}
function viewNote(i){const notes=LS.get('book_notes',[]);const n=notes[i];if(!n)return;const book=getBooks().find(x=>x.id===n.bookId);viewText('读书笔记 · '+(book?book.title:'(未知)')+' · '+n.date,n.body);}

// 通用写作列表渲染
function renderWriteList(type){
  const typeNames={all:'全部',emotion:'情绪',inspire:'灵感',invest:'投资',review:'影评'};
  const name=typeNames[type]||type;
  const list=getWrites().filter(w=>type==='all'||w.type===type).slice().sort((a,b)=>b.date.localeCompare(a.date));

  let h='<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">'+name+'</h3>';
  h+='<button class="btn pink sm" onclick="addWrite(\''+(type==='all'?'emotion':type)+'\')">+ 新'+name+'</button></div></div>';

  h+='<div class="card" id="wlBox">';
  if(!list.length)h+='<div class="empty">还没有，写一篇吧 ✍️</div>';
  else{
    list.forEach(w=>{
      const typeTag={emotion:'情绪',inspire:'灵感',invest:'投资',review:'影评',booknote:'读书笔记',diary:'日记'}[w.type]||w.type;
      h+='<div class="item" style="flex-direction:column;align-items:stretch" data-wid="'+w.id+'">';
      h+='<div class="row"><b>'+esc(w.title||'(无标题)')+'</b>';
      h+='<span class="chip">'+typeTag+'</span>';
      h+='<span class="meta">'+w.date+' · '+(w.body||'').length+' 字</span>';
      h+='<span class="right"><button class="btn xs" onclick="viewWriteById(\''+w.id+'\')">打开</button>';
      h+='<button class="btn xs" onclick="editWriteById(\''+w.id+'\')">编辑</button>';
      h+='<button class="del" onclick="delWriteById(\''+w.id+'\')">✕</button></span></div>';
      const preview=w.body.length>200?w.body.slice(0,200)+'…':w.body;
      h+='<div class="meta" style="white-space:pre-wrap;margin-top:4px;cursor:pointer" onclick="viewWriteById(\''+w.id+'\')">'+esc(preview)+'</div>';
      h+='</div>';
    });
  }
  h+='</div>';
  $('content').insertAdjacentHTML('beforeend',h);
}
function addWrite(type){
  const names={emotion:'情绪',inspire:'灵感',review:'影评',invest:'投资',booknote:'读书笔记',diary:'日记'};
  const name=names[type]||type;
  showModal({
    title:'写'+name,

// 选题推荐（自媒体转化灵感）
function renderTopics(){
  const b=getBooks();const c=getCards();const w=getWrites();
  const ideas=[];

  // from cards
  c.slice(0,5).forEach(cd=>{
    const bookName=b.find(x=>x.id===cd.bookId)?.title||'读书';
    ideas.push({cat:'深度解读',text:'从《'+bookName+'》的笔记延伸：「'+cd.text.slice(0,25)+'…」写一篇深度解读？'});
  });
  // from reading
  const reading=b.filter(x=>x.status==='在读');
  if(reading.length)ideas.push({cat:'阅读打卡',text:'《'+reading[0].title+'》正在读，分享一段触动你的话'});
  else ideas.push({cat:'阅读',text:'选一本想读的书，开启「每日10页」打卡计划 📖'});
  // from writing
  const recentReview=w.filter(x=>x.type==='review').slice(-2);
  if(recentReview.length)ideas.push({cat:'二创',text:'把《'+(recentReview[0].title||'影评')+'》改成小红书图文风格，测一下反响'});
  // from achievement
  const recentDone=getDoneList().slice(-2);
  if(recentDone.length)ideas.push({cat:'vlog',text:'「'+recentDone[0].text.slice(0,20)+'」做成自律打卡 vlog 文案'});
  // generic
  ideas.push({cat:'生活',text:'今天的一餐/一次锻炼/一个感悟，拍成治愈系日常 🌿'});
  ideas.push({cat:'复盘',text:'本周完成的事 vs 计划，做一个周复盘总结 📊'});
  ideas.push({cat:'方法',text:'分享你正在用的效率工具/学习方法/时间管理技巧 💡'});

  let h='<div class="card"><h3>自媒体选题推荐</h3>';
  h+='<div class="note">根据你的书架、卡片笔记、写作记录自动生成灵感。点击即可复制文案。</div></div>';

  ideas.forEach((idea,idx)=>{
    h+='<div class="item" style="cursor:pointer" onclick="copyTopic('+idx+')">';
    h+='<div class="row"><span class="chip pink">'+esc(idea.cat)+'</span></div>';
    h+='<div class="txt">'+esc(idea.text)+'</div>';
    h+='<div class="meta">点击复制 → 粘贴到小红书/公众号</div></div>';
  });

  // store for copy function
  window._topicIdeas=ideas;

  $('content').insertAdjacentHTML('beforeend',h);
}
function copyTopic(idx){
  const idea=window._topicIdeas?.[idx];if(!idea)return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(idea.text).then(()=>alert('已复制！去创作吧 ✍️'));
  } else{
    const ta=document.createElement('textarea');ta.value=idea.text;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    alert('已复制！');
  }
}

// 小红书预览
function xhsPreview(i){
  const w=getWrites()[i];if(!w)return;
  const text=('📝 '+w.title+'\n\n'+w.body).slice(0,900);
  const c=document.createElement('canvas');c.width=540;c.height=Math.min(1280,240+text.length*.95);
  c.style.maxWidth='100%';
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,540,0);g.addColorStop(0,'#ffd6e5');g.addColorStop(1,'#cdeafe');
  x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#3a4a55';x.font='bold 29px sans-serif';x.fillText(w.title||'笔记',40,56);
  x.font='21px sans-serif';let y=104;let line='';
  text.split('').forEach(ch=>{
    if(x.measureText(line+ch).width>460){x.fillText(line,40,y);line=ch;y+=33;}else line+=ch;
  });x.fillText(line,40,y);
  const url=c.toDataURL('image/png');
  const wnd=window.open('');
  if(wnd)wnd.document.write('<img src="'+url+'" style="max-width:100%"><br><br><a download="hangyi-xhs.png" href="'+url+'">⬇ 下载图片</a><br><br><textarea style="width:90%;height:200px;font-size:14px">'+esc(text.replace(/</g,'&gt;'))+'</textarea>');
}

function getDailyBBCArticle(){
  const saved=LS.get('bbc_article',null);
  const today=todayStr();
  if(saved&&saved.date===today)return saved;
  const idx=Math.floor(new Date(today).getTime()/86400000)%BBC_ARTICLES.length;
  const a=JSON.parse(JSON.stringify(BBC_ARTICLES[idx]));
  a.date=today;
  LS.set('bbc_article',a);
  return a;
}
function currentBBCArticle(){return getDailyBBCArticle();}
function resetBBCArticle(){const list=BBC_ARTICLES;const cur=currentBBCArticle();let idx=list.findIndex(x=>x.title===cur.title);if(idx<0)idx=0;idx=(idx+1)%list.length;const a=JSON.parse(JSON.stringify(list[idx]));a.date=todayStr();LS.set('bbc_article',a);renderEnglish();}

function wrapArticleWords(s){
  return s.replace(/([A-Za-z][A-Za-z'-]*)/g,'<span class="word" data-word="$1">$1</span>');
}

function lookupArticleWord(w){
  const r=$('modalOverlay');
  r.innerHTML='<div class="modal-box"><h3>'+esc(w)+'</h3><div id="wdRes" class="note"><span class="spin"></span>查询中…</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">关闭</button></div></div>';
  r.classList.add('show');
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w))
    .then(x=>x.json()).then(d=>{
      const box=$('wdRes');if(!box)return;
      if(!Array.isArray(d)){box.innerHTML='未找到该词 😢';return;}
      let html='<div style="font-size:14px">';
      d.slice(0,2).forEach(e=>{
        const ph=(e.phonetics||[]).find(p=>p.text);if(ph)html+='<div class="meta">'+esc(ph.text)+'</div>';
        (e.meanings||[]).forEach(m=>{
          html+='<div style="margin:8px 0"><span class="chip">'+esc(m.partOfSpeech)+'</span>';
          m.definitions.slice(0,2).forEach(df=>{
            html+='<div class="meta">• '+esc(df.definition)+(df.example?'<br>　<i>'+esc(df.example)+'</i>':'')+'</div>';
          });
          html+='</div>';
        });
      });
      html+='</div>';
      html+='<div style="margin-top:12px"><input id="wdMean" placeholder="中文释义（可选）" style="width:100%"></div>';
      box.innerHTML=html;
      const actions=r.querySelector('.modal-actions');
      actions.innerHTML='<button class="btn ghost" onclick="closeModal()">关闭</button><button class="btn primary" onclick="addToVocabFromArticle(\''+esc(w).replace(/'/g,"\\'")+'\')">+ 加入单词本</button>';
      // auto translate
      fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|zh-CN')
        .then(x=>x.json()).then(dt=>{
          const inp=$('wdMean');if(inp&&dt.responseStatus===200&&dt.responseData&&dt.responseData.translatedText)inp.value=dt.responseData.translatedText;
        }).catch(()=>{});
    }).catch(()=>{$('wdRes').innerHTML='查询失败，请检查网络 🌐';});
}

function addToVocabFromArticle(w){
  const mean=$('wdMean')?$('wdMean').value.trim():'';
  const v=getVocab();
  if(!v.find(x=>x.word.toLowerCase()===w.toLowerCase())){
    v.push({id:uid(),word:w,mean:mean,example:''});
    LS.set('vocab',v);toast('已加入单词本');
  } else {toast('单词本中已存在');}
  closeModal();
}

function speakArticle(){
  const a=currentBBCArticle();

}
function speakText(t){
  if(!('speechSynthesis'in window)){alert('浏览器不支持语音合成');return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;
  window.speechSynthesis.speak(u);
}

function followArticle(){
  const a=currentBBCArticle();
  const sentences=[];
  a.paragraphs.forEach(p=>{
    p.en.match(/[^.!?]+[.!?]+/g)?.forEach(s=>{
      const clean=s.trim();if(clean)sentences.push({en:clean,zh:''});
    });
  });
  if(!sentences.length){alert('没有可跟读的句子');return;}
  let idx=0;
  const render=()=>{
    const s=sentences[idx];
    const para=a.paragraphs.find(p=>p.en.includes(s.en.slice(0,30)))||{zh:''};
    let h='<div class="follow-mode">';
    h+='<div class="meta">BBC 每日精读 · 逐句跟读 ('+(idx+1)+'/'+sentences.length+')</div>';
    h+='<div class="big-sentence">'+esc(s.en)+'</div>';
    h+='<div class="meta" style="max-width:520px;margin:10px auto;line-height:1.7">'+esc(para.zh)+'</div>';

    h+='<button class="btn pink" onclick="speakThenPrompt(\''+esc(s.en).replace(/'/g,"\\'")+'\')">🗣️ 听后跟读</button>';
    h+='<button class="btn ghost" '+(idx>0?'onclick="prevSentence()"':'disabled')+'>← 上一句</button>';
    h+='<button class="btn ghost" '+(idx<sentences.length-1?'onclick="nextSentence()"':'disabled')+'>下一句 →</button>';

  };
  window._followSentences=sentences;window._followIdx=idx;window._followRender=render;

async function fetchBBCHeadlines(){
  const sources=[
    ()=>fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.bbci.co.uk/news/world/rss.xml')+'&_t='+Date.now())
      .then(r=>r.json()).then(d=>(d.items||[]).slice(0,6)),
    ()=>jsonpGet('https://feed.mix.sina.com.cn/api/roll/get?pageid=155&lid=2514&num=6&versionNumber=1.4.5&_t='+Date.now(),'sinaNewsCb').then(d=>{
      if(d&&d.result&&Array.isArray(d.result.data))return d.result.data.slice(0,6).map(a=>({title:a.title||'',link:a.url||a.link||'',description:a.summary||a.intro||''}));
      throw new Error('empty');
    })
  ];
  for(const fn of sources){
    try{const items=await fn();if(items&&items.length)return items;}catch(e){}
  }
  return [];
}

function renderBBCHeadlines(list){
  const box=$('bbcHeadlines');if(!box)return;
  if(!list.length){box.innerHTML='<div class="card"><div class="empty">暂无最新头条</div></div>';return;}
  let h='<div class="card"><h3>最新 BBC 头条</h3>';
  list.forEach(n=>{
    h+='<div class="item"><div class="txt">';
    if(n.link)h+='<a href="'+esc(n.link)+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;font-weight:600">'+esc(n.title)+'</a>';
    else h+='<b>'+esc(n.title)+'</b>';
    if(n.description||n.desc)h+='<div class="meta">'+esc((n.description||n.desc||'')).slice(0,120)+'</div>';
    h+='</div></div>';
  });
  h+='</div>';
  box.innerHTML=h;
}

let timer=null,timerState={mode:'work',left:0,total:0,running:false};
function getFocusSet(){return LS.get('focus_set',{work:25,break:5});}
function getFocusLog(){return LS.get('focus_log',[]);}

function renderFocus(){
  $('content').innerHTML='';
  const s=getFocusSet();
  const log=getFocusLog().filter(x=>x.date===todayStr());
  const mins=log.reduce((a,x)=>a+(x.dur||0),0);
  if(!timerState.left){timerState.left=s.work*60;timerState.total=s.work*60;}

  const fp=getFocusPlan()[todayStr()]||'';
  let ph='<div class="card"><h3>今日高价值任务</h3><div class="row"><textarea id="fp_text" placeholder="写下今天最复杂/最需专注的1-3件事（最难的先做）" style="min-height:64px">'+esc(fp)+'</textarea></div><div class="row"><button class="btn primary sm" onclick="saveFocusPlan()">保存</button>'+(fp?'<span class="chip on">已记录</span>':'')+'</div></div>';
  let h=ph+'<div class="card center"><h3 style="justify-content:center">专注记录 · 番茄钟</h3>';
  h+='<div class="timer" id="tmDisplay">'+fmtTime(timerState.left)+'</div>';
  h+='<div class="chip '+(timerState.mode==='work'?'on':'')+'">'+(timerState.mode==='work'?'专注中':'休息中')+'</div>';
  h+='<div class="row" style="justify-content:center;margin-top:12px;gap:8px">';
  h+='<button class="btn primary" id="toggleBtn" onclick="toggleTimer()">'+(timerState.running?'⏸ 暂停':'▶ 开始')+'</button>';
  h+='<button class="btn ghost" onclick="resetTimer()">重置</button>';
  h+='<button class="btn ghost" onclick="switchTimerMode()">切→'+(timerState.mode==='work'?'休息':'专注')+'</button></div>';
  h+='<div class="note">专注 '+s.work+'min / 休息 '+s.break+'min（设置里可改）</div></div>';

  h+='<div class="card"><h3>今日专注</h3><div class="row">';
  h+='<span class="chip on">'+log.length+' 段</span><span class="chip">'+mins+' 分钟</span></div>';
  if(log.length){
    h+='<div style="margin-top:6px">'+log.slice().reverse().map(x=>
      '<div class="item"><div class="txt">'+(x.mode==='work'?'🔥 专注':'☕ 休息')+' '+x.dur+'min</div><div class="meta">'+x.start+'</div></div>'
    ).join('')+'</div>';
  }
  h+='</div>';
  $('content').insertAdjacentHTML('beforeend',h);
}
function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;}
function toggleTimer(){
  if(timerState.running){
    clearInterval(timer);timerState.running=false;
  } else {
    timerState.running=true;
    timer=setInterval(()=>{
      timerState.left--;
      if(timerState.left<=0){completeTimer();return;}
      const el=$('tmDisplay');if(el)el.textContent=fmtTime(timerState.left);
    },1000);
  }
  // update button text without full re-render
  const btn=$('toggleBtn');if(btn)btn.textContent=timerState.running?'⏸ 暂停':'▶ 开始';
}
function completeTimer(){
  clearInterval(timer);timerState.running=false;
  const s=getFocusSet();const log=getFocusLog();
  const dur=timerState.mode==='work'?s.work:s.break;
  log.push({date:todayStr(),start:nowHMS(),dur,mode:timerState.mode});
  LS.set('focus_log',log);
  // voice notification
  if('speechSynthesis'in window){
    const u=new SpeechSynthesisUtterance(timerState.mode==='work'?'专注结束，休息一下吧 ☕':'休息结束，继续加油 🔥');
    u.lang='zh-CN';window.speechSynthesis.speak(u);
  }
  timerState.mode=timerState.mode==='work'?'break':'work';
  timerState.left=(timerState.mode==='work'?s.work:s.break)*60;
  renderFocus();
}
function switchTimerMode(){
  if(timer)clearInterval(timer);timerState.running=false;
  const s=getFocusSet();
  timerState.mode=timerState.mode==='work'?'break':'work';
  timerState.left=(timerState.mode==='work'?s.work:s.break)*60;
  renderFocus();
}
function resetTimer(){
  if(timer)clearInterval(timer);timerState.running=false;
  const s=getFocusSet();timerState.mode='work';timerState.left=s.work*60;
  renderFocus();
}


/* ================================================================
   模块 8：回顾报告（周/月 自动提示）
   ================================================================ */
function isoWeek(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);
  return dt.getUTCFullYear()+'-W'+String(Math.ceil((dt-Date.UTC(dt.getUTCFullYear(),0,1))/604800000)).padStart(3,'0');
}

function renderReport(span){
  const days=span==='week'?7:30;
  const end=new Date();end.setMinutes(end.getMinutes()-end.getTimezoneOffset());
  const start=new Date(end.getTime()-(days-1)*86400000);
  const sd=start.toISOString().slice(0,10),ed=end.toISOString().slice(0,10);
  const inRange=d=>d>=sd&&d<=ed;

  // collect stats
  let planDays=0,planTot=0,planDone=0;
  for(let i=0;i<days;i++){
    const ds=new Date(start.getTime()+i*86400000).toISOString().slice(0,10);
    const d=LS.get('plan_'+ds,null);
    if(d){planDays++;d.forEach(b=>(b.items||[]).forEach(it=>{planTot++;if(it.done)planDone++;}));}
  }
  const planPct=planTot?Math.round(planDone/planTot*100):0;

  // sleep
  const sl=LS.get('sleep',[]).filter(x=>inRange(x.date));
  let avgSl=0;
  if(sl.length){
    avgSl=Math.round(sl.reduce((a,x)=>{
      const [bh,bm]=(x.bed||'0:0').split(':').map(Number);
      const [wh,wm]=(x.wake||'0:0').split(':').map(Number);
      let m=(wh*60+wm)-(bh*60+bm);if(m<0)m+=1440;return a+m;
    },0)/sl.length/60*10)/10;
  }

  // exercise
  const ex=LS.get('ex_logs',[]).filter(x=>inRange(x.date));
  const exCnt=ex.length,exMin=ex.reduce((a,x)=>a+(+x.dur||0),0);

  // weight
  const wt=LS.get('weight',[]).filter(x=>inRange(x.date)).sort((a,b)=>a.date<b.date?-1:1);
  const wChg=wt.length>1?(wt[wt.length-1].val-wt[0].val):0;

  // reading
  const books=getBooks();
  const reading=books.filter(x=>x.status==='在读').length;
  const readDone=books.filter(x=>x.status==='读完').length;

  // focus
  const foc=LS.get('focus_log',[]).filter(x=>inRange(x.date));
  const focMin=foc.reduce((a,x)=>a+(x.dur||0),0);

  // writing / done
  const wr=LS.get('writes',[]).filter(x=>inRange(x.date)).length;
  const dn=LS.get('done_list',[]).filter(x=>inRange(x.date)).length;

  let h='<div class="card"><div class="row" style="justify-content:space-between">';
  h+='<h3 style="margin:0">'+(span==='week'?'周':'月')+'回顾报告</h3>';
  h+='<div class="seg"><button class="'+(span==='week'?'on':'')+'" onclick="renderReport(\'week\')">近7天</button>';
  h+='<button class="'+(span==='month'?'on':'')+'" onclick="renderReport(\'month\')">近30天</button></div></div>';
  h+='<div class="row"><button class="btn sm" onclick="window.print()">🖨 打印/导出PDF</button></div></div>';

  h+='<div class="grid cols2">';
  h+='<div class="kpi"><div class="v">'+planPct+'%</div><div class="l">打卡完成率 ('+planDays+'天)</div></div>';
  h+='<div class="kpi"><div class="v">'+avgSl+'<small>h</small></div><div class="l">平均睡眠</div></div>';
  h+='<div class="kpi"><div class="v">'+exCnt+'<small>次</small></div><div class="l">锻炼 '+exMin+'分钟</div></div>';
  h+='<div class="kpi"><div class="v" style="font-size:18px">'+(wChg>0?'+':'')+wChg.toFixed(1)+'</div><div class="l">体重变化kg</div></div>';
  h+='<div class="kpi"><div class="v">'+reading+'/'+readDone+'</div><div class="l">在读/读完</div></div>';
  h+='<div class="kpi"><div class="v">'+focMin+'<small>分</small></div><div class="l">专注时长</div></div>';
  h+='<div class="kpi"><div class="v">'+wr+'/'+dn+'</div><div class="l">写作/成就</div></div>';
  h+='<div class="kpi"><div class="v">'+getCards().length+'</div><div class="l">卡片笔记</div></div>';
  h+='</div>';

  const rdays=span==='week'?7:30;const rarr=[];
  for(let i=rdays-1;i>=0;i--){const dt=new Date();dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());const ds=new Date(dt.getTime()-i*86400000).toISOString().slice(0,10);const p=dayCompletePct(ds);rarr.push(p==null?0:p);}
  const rtop=topUnfinished(rdays);const rsk=streakDays();
  h+='<div class="card"><h3>打卡完成率趋势</h3>'+svgLine(rarr,{color:'#e986ab'})+'</div>';
  h+='<div class="grid cols2"><div class="kpi"><div class="v">'+rsk+'</div><div class="l">连续全勤天数</div></div>';
  h+='<div class="card" style="grid-column:1/-1"><h3>最常未完成 Top3</h3>'+(rtop.length?'':'<div class="empty">暂无 🎉</div>');
  rtop.forEach((t,i)=>h+='<div class="item"><div class="txt"><b>'+(i+1)+'. </b>'+esc(t.t)+'</div><div class="meta">'+t.n+' 次</div></div>');
  h+='</div></div>';

  // summary sentence
  h+='<div class="card"><h3>小结</h3><div class="meta">';
  h+='这段时间打卡完成率 '+planPct+'%，平均睡眠 '+avgSl+'h，锻炼 '+exCnt+' 次。';
  if(wChg<0)h+='体重下降 '+Math.abs(wChg).toFixed(1)+'kg，保持住！💪';
  else if(wChg>0)h+='体重上升 '+wChg.toFixed(1)+'kg，注意饮食运动。';
  else h+='体重平稳。👍';
  h+='</div></div>';

  // mark as viewed
  const rp=LS.get('report_prompt',{});

function applyBackup(txt){
  try{
    const o=JSON.parse(txt);
    let n=0;
    Object.keys(o).forEach(k=>{
      if(k.indexOf('hy_')===0){
        localStorage.setItem(k,typeof o[k]==='string'?o[k]:JSON.stringify(o[k]));n++;
      }
    });
    closeModal();
    alert('导入成功！共恢复 '+n+' 项，页面将刷新…');location.reload();
  }catch(e){alert('解析失败：'+e.message);}
}
/* 离线文件支持：若本文件内嵌了 __HY_SEED__（由「导出离线副本」烤入），
   且本地尚未有数据，则自动把数据写入 localStorage。file:// 下 localStorage 会持久保存，
   因此离线文件可像普通 App 一样持续使用，无需任何服务器。 */
function applySeed(){
  try{
    if(window.__HY_SEED__ && typeof window.__HY_SEED__==='object'){
      const has=Object.keys(localStorage).some(k=>k.indexOf('hy_')===0);
      if(!has){
        Object.keys(window.__HY_SEED__).forEach(k=>{
          if(k.indexOf('hy_')===0){
            const v=window.__HY_SEED__[k];
            localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v));
          }
        });
      }
    }
  }catch(e){}
}
/* 导出离线副本：把当前全部数据烤进一份独立 HTML 文件并下载。
   该文件自带数据 + 图标，存到手机「文件」App 后，从那打开即永不停止。 */
function exportOfflineFile(){
  try{
    const data={};
    Object.keys(localStorage).filter(k=>k.indexOf('hy_')===0).forEach(k=>{
      try{data[k]=JSON.parse(localStorage.getItem(k));}catch(e){data[k]=localStorage.getItem(k);}
    });
    const seed='window.__HY_SEED__='+JSON.stringify(data)+';';
    let html=document.documentElement.outerHTML;
    if(html.indexOf('</head>')>0) html=html.replace('</head>','<script>'+seed+'<\/script></head>');
    else html='<script>'+seed+'<\/script>'+html;
    const blob=new Blob([html],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='航一-离线工作台.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    setTimeout(()=>alert('已生成「航一-离线工作台.html」。\n\niPhone：点下方「下载/打开」后，用分享钮(□↑)选「保存至文件」存到 iCloud 云盘；\n以后在「文件」App 里点开它就能用，数据都在、永不停止、换手机也能带走。'),600);
  }catch(e){alert('生成失败：'+e.message);}
}

/* 前台保活：App 打开时每 2.5 分钟静默请求自身（HEAD，几乎零流量），
   防止沙箱因空闲被判定休眠。仅在在线时运行。 */
function startKeepAlive(){
  if(!navigator.onLine) return;
  if(location.protocol==='file:'||location.protocol==='data:') return;
  setInterval(()=>{
    try{
      const u=location.origin+location.pathname+'?_ka='+Date.now();
      fetch(u,{method:'HEAD',cache:'no-store',mode:'no-cors'}).catch(()=>{});
    }catch(e){}
  },150000);
}
/* ================================================================
   新增：图表 / 统计 / 每日打卡 / 提醒 引擎（v4）
   所有数据沿用 hy_ 前缀键，旧备份可正常导入

let planView='today';        // today | review
let planReviewSpan='week';   // week | month

function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function dayCompletePct(date){
  const d=LS.get('plan_'+date,null);if(!d||!d.length)return null;
  let t=0,dn=0;d.forEach(b=>(b.items||[]).forEach(it=>{t++;if(it.done)dn++;}));
  return t?Math.round(dn/t*100):0;
}
function periodOf(time){
  const m=(time||'').match(/(\d{1,2}):/);const h=m?parseInt(m[1]):0;
  if(h<8)return '晨间';if(h<12)return '上午';if(h<14)return '午间';if(h<18)return '下午';return '晚间';
}
function planPeriodStats(date){
  const d=LS.get('plan_'+date,null);const out={};
  ['晨间','上午','午间','下午','晚间'].forEach(p=>out[p]={t:0,d:0});
  if(!d)return out;
  d.forEach(b=>{const p=periodOf(b.time);(b.items||[]).forEach(it=>{if(out[p]){out[p].t++;if(it.done)out[p].d++;}});});
  return out;
}
function streakDays(){
  let s=0;const today=new Date();
  for(let i=0;i<400;i++){
    const dt=new Date(today.getTime()-i*86400000);dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());
    const ds=dt.toISOString().slice(0,10);
    const pct=dayCompletePct(ds);
    if(pct===null){if(i===0)continue;else break;}
    if(pct>=100)s++;else break;
  }
  return s;
}
function topUnfinished(days){
  const cnt={};
  for(let i=0;i<days;i++){
    const dt=new Date();dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());
    const ds=new Date(dt.getTime()-i*86400000).toISOString().slice(0,10);
    const d=LS.get('plan_'+ds,null);if(!d)continue;
    d.forEach(b=>(b.items||[]).forEach(it=>{if(!it.done)cnt[it.t]=(cnt[it.t]||0)+1;}));
  }
  return Object.keys(cnt).map(k=>({t:k,n:cnt[k]})).sort((a,b)=>b.n-a.n).slice(0,3);
}
function svgLine(vals,opt){
  opt=opt||{};const w=opt.w||300,h=opt.h||92,max=opt.max||100,color=opt.color||'#e986ab';
  const n=vals.length;if(!n)return '<div class="empty">暂无数据</div>';
  const pad=6,bw=w-pad*2,bh=h-pad*2,step=n>1?bw/(n-1):0;
  const pts=vals.map((v,i)=>{const x=pad+step*i;const y=pad+bh-(Math.min(v,max)/max)*bh;return x.toFixed(1)+','+y.toFixed(1);});
  let grid='';for(let g=0;g<=2;g++){const y=pad+bh*g/2;grid+='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="rgba(120,130,150,.16)" stroke-width="1"/>';}
  const path='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  const dots=pts.map(p=>'<circle cx="'+p.split(',')[0]+'" cy="'+p.split(',')[1]+'" r="2.6" fill="'+color+'"/>').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block">'+grid+path+dots+'</svg>';
}
function svgBars(vals,opt){
  opt=opt||{};const w=opt.w||300,h=opt.h||104,color=opt.color||'#7fb2e6';
  const n=vals.length;if(!n)return '<div class="empty">暂无数据</div>';
  const pad=8,gap=5,bw=(w-pad*2-gap*(n-1))/n,bh=h-pad*2-10;
  const max=Math.max(1,...vals.map(v=>v.v||0));
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="display:block">';
  vals.forEach((d,i)=>{
    const v=d.v||0,bh2=bh*(v/max),x=pad+i*(bw+gap),y=pad+bh-bh2;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh2.toFixed(1)+'" rx="3" fill="'+color+'"/>';
    if(d.l)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-2)+'" font-size="9" fill="#8a93a6" text-anchor="middle">'+esc(d.l)+'</text>';
    if(d.v!=null)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" font-size="9" fill="#6b7488" text-anchor="middle">'+d.v+'</text>';
  });
  s+='</svg>';return s;
}

function getReadLog(){return LS.get('read_log',{});}
function isReadChecked(date){
  const r=getReadLog()[date];
  if(!r)return false;
  if(typeof r.checked==='boolean')return r.checked;
  return ((r.morning||0)+(r.noon||0))>0; // 兼容旧数据
}
function toggleReadToday(){
  const l=getReadLog();const today=todayStr();
  l[today]={checked:!isReadChecked(today),date:today};
  LS.set('read_log',l);renderRead();
}
function saveReadToday(m,n){const l=getReadLog();l[todayStr()]={checked:true,date:todayStr()};LS.set('read_log',l);}
function readStats(){
  const l=getReadLog(),keys=Object.keys(l),ws=weekStart(),ym=todayStr().slice(0,7),yr=todayStr().slice(0,4);
  const cnt=f=>keys.filter(f).filter(k=>isReadChecked(k)).length;
  return {week:cnt(k=>k>=ws),month:cnt(k=>k.slice(0,7)===ym),year:cnt(k=>k.slice(0,4)===yr)};
}
/* ---- 写作：每日字数打卡 ---- */
function getWriteLog(){return LS.get('write_log',{});}
function saveWriteToday(w){const l=getWriteLog();l[todayStr()]=+w||0;LS.set('write_log',l);}
function writeStats(){
  const all=getWrites();
  const dates=[...new Set(all.map(w=>w.date))].sort();
  const ws=weekStart(),ym=todayStr().slice(0,7),yr=todayStr().slice(0,4);
  const sum=f=>dates.filter(f).reduce((a,k)=>a+writeWordCount(k),0);
  let s=0;const t=new Date();
  for(let i=0;i<400;i++){const dt=new Date(t.getTime()-i*86400000);dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());const ds=dt.toISOString().slice(0,10);if(writeWordCount(ds)>0)s++;else if(i===0)continue;else break;}
  return {today:writeWordCount(todayStr()),week:sum(k=>k>=ws),month:sum(k=>k.slice(0,7)===ym),year:sum(k=>k.slice(0,4)===yr),streak:s};
}
/* ---- 饮食：每日勾选 ---- */
function getDietChk(){return LS.get('diet_chk',{});}
function saveDietChk(o){const l=getDietChk();l[todayStr()]=o;LS.set('diet_chk',l);}
function toggleDiet(f){const d=getDietChk()[todayStr()]||{bf:false,lunch:false,dinner:false,mv:false,water:0};d[f]=!d[f];saveDietChk(d);renderDiet();}
function dietComplianceWeek(){
  const l=getDietChk(),ws=weekStart();let days=0,comp=0;
  Object.keys(l).filter(k=>k>=ws).forEach(k=>{days++;const d=l[k];if(d.bf&&d.lunch&&d.dinner)comp++;});
  return {days,comp};
}
/* ---- 专注：今日高价值任务 ---- */
function getFocusPlan(){return LS.get('focus_plan',{});}
function saveFocusPlan(){const v=$('fp_text')?$('fp_text').value.trim():'';const l=getFocusPlan();l[todayStr()]=v;LS.set('focus_plan',l);renderFocus();}
/* ---- 身体：本周看板 ---- */
function bodyWeekStats(){
  const ws=weekStart();
  const ex=getExLogs?getExLogs().filter(x=>x.date>=ws):[];
  const exDays=new Set(ex.map(x=>x.date)).size;
  const dc=getDietChk();let dietOk=0,dietDays=0;
  Object.keys(dc).filter(k=>k>=ws).forEach(k=>{dietDays++;if(dc[k].bf&&dc[k].lunch&&dc[k].dinner)dietOk++;});
  const sl=(typeof getSleepLogs==='function')?getSleepLogs().filter(x=>x.date>=ws):[];
  let avgSl=0;if(sl.length){avgSl=Math.round(sl.reduce((a,x)=>{if(x.dur!=null)return a+x.dur*60;const [bh,bm]=(x.bed||'0:0').split(':').map(Number);const [wh,wm]=(x.wake||'0:0').split(':').map(Number);let m=(wh*60+wm)-(bh*60+bm);if(m<0)m+=1440;return a+m;},0)/sl.length/60*10)/10;}
  return {exDays,dietOk,dietDays,avgSl};
}

/* ---- 打卡复盘 ---- */
function renderPlanReview(){
  const days=planReviewSpan==='week'?7:30;
  const arr=[];
  for(let i=days-1;i>=0;i--){const dt=new Date();dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());const ds=new Date(dt.getTime()-i*86400000).toISOString().slice(0,10);arr.push({date:ds.slice(5),pct:dayCompletePct(ds)});}
  const lineVals=arr.map(a=>a.pct==null?0:a.pct);
  const ps=planPeriodStats(todayStr());
  const bars=['晨间','上午','午间','下午','晚间'].map(p=>({l:p,v:ps[p]?Math.round(ps[p].d/(ps[p].t||1)*100):0}));
  const top=topUnfinished(days);
  const sk=streakDays();
  let best={avg:-1,wk:''};
  for(let w=0;w<8;w++){let sum=0,c=0;for(let i=w*7;i<w*7+7;i++){const dt=new Date();dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());const ds=new Date(dt.getTime()-i*86400000).toISOString().slice(0,10);const p=dayCompletePct(ds);if(p!=null){sum+=p;c++;}}if(c){const avg=Math.round(sum/c);if(avg>best.avg)best={avg,wk:'第'+(w+1)+'周前'};}}
  let h='<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">打卡复盘</h3>';
  h+='<div class="seg"><button class="'+(planReviewSpan==='week'?'on':'')+'" onclick="planReviewSpan=\'week\';renderPlanReview()">近7天</button>';
  h+='<button class="'+(planReviewSpan==='month'?'on':'')+'" onclick="planReviewSpan=\'month\';renderPlanReview()">近30天</button></div></div>';
  h+='<button class="btn sm ghost" onclick="planView=\'today\';renderPlan()">← 返回今日打卡</button>';
  h+='<div class="card"><h3>每日完成率</h3>'+svgLine(lineVals,{color:'#e986ab'})+'<div class="meta">100%=全勤，灰色区=当天无记录</div></div>';
  h+='<div class="card"><h3>今日各时段完成率</h3>'+svgBars(bars,{color:'#7fb2e6'})+'</div>';
  h+='<div class="grid cols2">';
  h+='<div class="kpi"><div class="v">'+sk+'</div><div class="l">连续全勤天数</div></div>';
  h+='<div class="kpi"><div class="v">'+(best.avg>=0?best.avg+'%':'—')+'</div><div class="l">最佳周 '+(best.wk||'—')+'</div></div></div>';
  h+='<div class="card" style="grid-column:1/-1"><h3>最常未完成 Top3</h3>';
  if(!top.length)h+='<div class="empty">暂无 — 太棒了 🎉</div>';
  else top.forEach((t,i)=>h+='<div class="item"><div class="txt"><b>'+(i+1)+'. </b>'+esc(t.t)+'</div><div class="meta">'+t.n+' 次</div></div>');
  h+='</div></div>';
  $('content').innerHTML=h;
}

/* ---- 时段提醒引擎 ---- */
function getReminders(){return LS.get('reminders',{enabled:true,times:[{t:'09:00',label:'早餐(9:00前)'},{t:'12:00',label:'午餐(12:00前)'},{t:'15:30',label:'西罗莫司'},{t:'20:30',label:'拉窗帘调灯光'},{t:'17:00',label:'未完成待办汇总'}]});}
let _firedToday={};
function toastMsg(msg){
  let t=document.getElementById('remindToast');
  if(!t){t=document.createElement('div');t.id='remindToast';t.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:70;background:rgba(40,52,64,.95);color:#fff;font-size:14px;padding:11px 16px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;max-width:88%;text-align:center';document.body.appendChild(t);}
  t.textContent='🔔 '+msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.opacity='0',4500);
}
function toast(m){toastMsg(m);}
function fireNotify(msg){
  if('Notification'in window&&Notification.permission==='granted'){try{new Notification('航一提醒',{body:msg});}catch(e){}}
  toastMsg(msg);
}
function checkReminders(){
  const r=getReminders();if(!r.enabled)return;
  const now=new Date();const cur=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const ds=todayStr();
  r.times.forEach(tm=>{
    const key=ds+'|'+tm.t;
    if(tm.t===cur&&!_firedToday[key]){
      _firedToday[key]=true;let msg=tm.label;
      if(tm.t==='17:00'){const day=getPlanDay(todayStr());let undone=0;day.forEach(b=>(b.items||[]).forEach(it=>{if(!it.done)undone++;}));msg='今日还有 '+undone+' 项未完成，加油完成 ✨';}
      fireNotify(msg);
    }
  });
}
function requestReminderPerm(){
  if(!('Notification'in window)){toastMsg('当前浏览器不支持通知，已用弹窗提醒');return;}
  Notification.requestPermission().then(p=>{toastMsg(p==='granted'?'已开启系统通知 🔔':'已用应用内弹窗提醒');renderSettings();});
}
function toggleReminders(){const r=getReminders();r.enabled=!r.enabled;LS.set('reminders',r);renderSettings();}

window.addEventListener('DOMContentLoaded',init);
</script>
